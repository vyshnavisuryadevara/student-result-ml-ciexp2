
name: Student Result ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Train the ML model
        run: |
          python train_model.py

      - name: Verify generated model files
        run: |
          echo "Checking generated files..."
          ls -la
          test -f student_result_model.pkl
          test -f metrics.json
          test -f student_results.csv
          echo "All model files generated successfully."

      - name: Run tests
        run: |
          pytest -v

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp student_result_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          printf "Student Result Prediction ML Application\nRun: python app.py\nEndpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt

      - name: Verify release candidate
        run: |
          echo "Checking release candidate..."
          ls -la release_candidate/
          test -f release_candidate/app.py
          test -f release_candidate/student_result_model.pkl
          test -f release_candidate/metrics.json
          test -f release_candidate/requirements.txt
          test -f release_candidate/Dockerfile
          test -f release_candidate/.dockerignore
          test -f release_candidate/DEPLOYMENT.txt
          echo "Release candidate verified successfully."

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: student-result-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
